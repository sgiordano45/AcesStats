<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Pick-up and scrimmage games: set a date, RSVP, split balanced teams, and keep the photos and the score.">
<title>Pick-up - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/media.css">
<link rel="stylesheet" href="css/pickup.css">
</head>
<body class="aces-v2">

<!-- pickup.html: pick-up and scrimmage games (js/pages/pickup.js; ratings and team balancer in js/domain/pickup.js).
     No ?id: the list of games. ?id=<pickupGames doc>: one game, with RSVP / Teams / Photos / Result tabs. -->

<main class="pu aces-container" id="main">
  <header class="aces-page-head">
    <div>
      <span class="aces-page-kicker" id="puKicker">Play</span>
      <h1 class="aces-page-title" id="puTitle">Pick-up</h1>
      <p class="pu-desc" id="puDesc">Scrimmages and pick-up games. Set a date, see who's in, and split balanced teams.</p>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span></div>
    <div class="aces-card"><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
  </div>

  <div data-page-content hidden>
    <!-- List view -->
    <div id="puList" hidden>
      <div id="puListHead"></div>
      <form class="aces-card pu-form" id="puForm" hidden novalidate></form>
      <section id="puUpcoming"></section>
      <section id="puPast"></section>
    </div>

    <!-- One game -->
    <div id="puGame" hidden>
      <div id="puGameHead"></div>
      <form class="aces-card pu-form" id="puEditForm" hidden novalidate></form>
      <nav class="aces-tabs pu-tabs" id="puTabs" aria-label="Game sections"></nav>
      <section id="pu-rsvp" hidden></section>
      <section id="pu-teams" hidden></section>
      <section id="pu-photos" hidden></section>
      <section id="pu-result" hidden></section>
    </div>
  </div>
</main>

<dialog class="media-viewer" id="puViewer" aria-label="Photo viewer">
  <button type="button" class="media-viewer-btn is-close" data-viewer-close aria-label="Close"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-close"></use></svg></button>
  <button type="button" class="media-viewer-btn is-prev" data-viewer-step="-1" aria-label="Previous"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-chevron-left"></use></svg></button>
  <div class="media-viewer-stage" data-stage></div>
  <button type="button" class="media-viewer-btn is-next" data-viewer-step="1" aria-label="Next"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-chevron-right"></use></svg></button>
  <div class="media-viewer-info" data-info></div>
</dialog>

<script type="module" src="js/pages/pickup.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
