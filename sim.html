<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Aces Sim: draft nine players from this season's rosters, rated from their real stats, and play seven innings against the computer.">
<title>Aces Sim - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/sim.css">
</head>
<body class="aces-v2">

<!-- sim.html: Aces Sim (js/pages/sim.js). Draft 9 vs the computer from the season pool,
     set the lineup, play 7 innings on the pixel field (js/features/sim/field.js).
     Ratings: js/domain/sim-ratings.js, set in admin/sim-ratings.html. Engine: js/domain/sim-engine.js.
     Progress is kept in this browser (localStorage acesSim.v1). -->

<main class="sim aces-container" id="main">
  <header class="aces-page-head">
    <div>
      <span class="aces-page-kicker">Play</span>
      <h1 class="aces-page-title">Aces Sim</h1>
      <p class="sim-desc" id="simDesc">Draft nine players from this season's rosters, rated from their real stats, then play seven innings against the computer.</p>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span></div>
    <div class="aces-card"><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
  </div>

  <div data-page-content hidden>
    <section id="simSetup" hidden></section>
    <section id="simDraft" hidden></section>
    <section id="simLineup" hidden></section>
    <section id="simGame" hidden>
      <div class="sim-board" id="simBoard"></div>
      <div class="sim-play">
        <div class="sim-stage">
          <canvas id="simCanvas" class="sim-canvas" aria-label="The field"></canvas>
          <div class="sim-decide" id="simDecide" hidden></div>
        </div>
        <aside class="sim-side" id="simSide"></aside>
      </div>
      <div class="sim-controls">
        <button class="aces-btn is-primary" type="button" id="simNext">Next play</button>
        <button class="aces-btn" type="button" id="simAuto" aria-pressed="false">Auto-play</button>
        <button class="aces-btn" type="button" id="simHalf">Sim half inning</button>
        <button class="aces-btn" type="button" id="simEnd">Sim to the end</button>
        <span class="aces-select-wrap"><select class="aces-select" id="simSpeed" aria-label="Animation speed">
          <option value="1">Speed 1x</option><option value="2">Speed 2x</option><option value="4">Speed 4x</option><option value="0">No animation</option>
        </select></span>
        <label class="sim-check"><input type="checkbox" id="simAsk"> Ask me on close plays</label>
      </div>
      <section class="aces-card sim-log-card">
        <h2 class="aces-card-title">Play-by-play</h2>
        <ol class="sim-log" id="simLog" reversed></ol>
      </section>
    </section>
    <section id="simFinal" hidden></section>
  </div>
</main>

<script type="module" src="js/pages/sim.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
