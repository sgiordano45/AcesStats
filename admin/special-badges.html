<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="../js/core/preview-guard.js"></script>
<link rel="manifest" href="../manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="robots" content="noindex">
<title>Special badges - Admin - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../mobile-enhancements.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/admin-stats.css">
</head>
<body class="aces-v2 adm">

<!-- admin/special-badges.html: one-off badges for a moment in a game (js/admin/special-badges.js).
     Stored in specialBadges, so the badge calculator never overwrites them. They show on the
     player's Badges tab under Legendary moments. -->

<div class="adm-shell aces-container" data-page-content>
  <aside class="adm-side" id="adminSide" aria-label="Admin tools">
    <div class="adm-filter">
      <input class="aces-input" id="adminFilter" type="search" placeholder="Find a tool..." aria-label="Find a tool" autocomplete="off">
    </div>
    <nav id="adminNav"></nav>
  </aside>

  <main class="adm-main" id="main">
    <header class="aces-page-head">
      <div>
        <span class="aces-page-kicker" id="adminWho">Admin</span>
        <h1 class="aces-page-title">Special badges</h1>
      </div>
      <div class="stp-controls">
        <span class="aces-select-wrap"><select class="aces-select" id="spbSeason" aria-label="Season"></select></span>
        <button class="aces-btn adm-menu-btn" id="adminMenuBtn" type="button" aria-controls="adminSide">All tools</button>
      </div>
    </header>

    <p class="stp-intro">One-off badges for a moment worth remembering. They show on the player's Badges tab under Legendary moments and are never touched by the badge calculator.</p>

    <section class="aces-card agg-card spb-form">
      <h2 class="aces-card-title">Award a badge</h2>
      <div class="spb-grid">
        <div class="aces-field">
          <label class="aces-label" for="spbGame">Game</label>
          <span class="aces-select-wrap"><select class="aces-select" id="spbGame"></select></span>
        </div>
        <div class="aces-field">
          <label class="aces-label" for="spbPlayer">Player</label>
          <span class="aces-select-wrap"><select class="aces-select" id="spbPlayer" disabled><option value="">Pick a game first</option></select></span>
        </div>
        <div class="aces-field">
          <label class="aces-label" for="spbName">Badge name</label>
          <input class="aces-input" id="spbName" type="text" maxlength="60" placeholder="Face Value">
        </div>
        <div class="aces-field">
          <label class="aces-label" for="spbIcon">Icon file name</label>
          <input class="aces-input" id="spbIcon" type="text" maxlength="80" placeholder="face-value" autocomplete="off">
          <span class="sse-dim spb-hint">Upload the PNG to <code>assets/badges/special/</code>. Leave blank for the medal.</span>
        </div>
        <div class="aces-field spb-wide">
          <label class="aces-label" for="spbDesc">Description</label>
          <input class="aces-input" id="spbDesc" type="text" maxlength="200" placeholder="Made an out with your face.">
        </div>
      </div>
      <div class="spb-preview" id="spbPreview" aria-live="polite"></div>
      <div class="sse-actions"><button class="aces-btn is-primary" id="spbSave" type="button">Award badge</button></div>
    </section>

    <section class="aces-card agg-card">
      <h2 class="aces-card-title">Awarded <span class="stp-count" id="spbCount"></span></h2>
      <div id="spbList"><p class="sse-dim">Loading...</p></div>
    </section>
  </main>
</div>

<script type="module" src="../js/admin/special-badges.js"></script>
</body>
</html>
