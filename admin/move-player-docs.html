<!DOCTYPE html>
<html lang="en">
<head>
<base href="../">
<meta name="robots" content="noindex">
<script type="module" src="js/core/preview-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/admin.css">
<title>Move Player Docs - Mountainside Aces</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #1a1a2e; color: #eee; }
  .container { background: #16213e; border-radius: 12px; padding: 30px; }
  label { display: block; margin: 12px 0 4px; font-size: 14px; }
  input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #0f1a30; color: #eee; box-sizing: border-box; }
  button { margin: 16px 8px 0 0; padding: 10px 18px; border: 0; border-radius: 6px; background: #3b82f6; color: #fff; cursor: pointer; }
  button.danger { background: #dc2626; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  pre { background: #0b1220; padding: 12px; border-radius: 8px; height: 300px; overflow: auto; font-size: 13px; white-space: pre-wrap; }
</style>
<link rel="stylesheet" href="css/admin-legacy.css">
</head>
<body class="aces-v2 adm adm-legacy">

<div class="adm-shell aces-container" data-page-content>
  <aside class="adm-side" id="adminSide" aria-label="Admin tools">
    <div class="adm-filter">
      <input class="aces-input" id="adminFilter" type="search" placeholder="Find a tool..." aria-label="Find a tool" autocomplete="off">
    </div>
    <nav id="adminNav"></nav>
  </aside>

  <main class="adm-main" id="main">
    <header class="aces-page-head">
      <div>
        <span class="aces-page-kicker" id="adminWho">Admin</span>
        <h1 class="aces-page-title">Move player docs</h1>
      </div>
      <div class="adm-head-actions">
        <button class="aces-btn adm-menu-btn" id="adminMenuBtn" type="button" aria-controls="adminSide">All tools</button>
      </div>
    </header>

<div class="container">
  
  <p>Copies every doc in <code>playerStats/{from}/games</code> and <code>pitchingStats/{from}/games</code> to <code>{to}</code> and sets <code>playerId</code>. Does NOT delete the originals.</p>
  <label>From ID (wrong)</label>
  <input id="fromId" value="paul_treyman_jr.">
  <label>To ID (correct)</label>
  <input id="toId" value="paul_treyman_jr">
  <button id="previewBtn" disabled>Preview</button>
  <button id="runBtn" class="danger" disabled>Copy Docs</button>
  <pre id="output"></pre>
</div>


  </main>
</div>

<script type="module">
  import { initPage, pageReady } from './js/core/app.js';
  import { mountAdminShell } from './js/admin/shell.js';
  initPage({ title: 'Move Player Docs', requiresAuth: true }).then((ctx) => mountAdminShell(ctx.profile, 'admin/move-player-docs.html'));
  import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
  import { getFirestore, collection, doc, getDocs, getDoc, setDoc } from './js/core/firebase.js';

  // The site's own setup (js/core/firebase.js) has already started the default app; reuse it.
const app = getApps().length ? getApp() : initializeApp({
    apiKey: "AIzaSyCAEWkrTcprzJ2KPPJu-vFJPvYOVU4ky20",
    authDomain: "acessoftballreference-84791.firebaseapp.com",
    projectId: "acessoftballreference-84791",
    storageBucket: "acessoftballreference-84791.firebasestorage.app",
    messagingSenderId: "777699560175",
    appId: "1:777699560175:web:4092b422e7d7116352e91a"
  });
  const auth = getAuth(app);
  const db = getFirestore(app);
  const out = document.getElementById('output');
  const log = m => { out.textContent += m + '\n'; out.scrollTop = out.scrollHeight; };

  async function run(commit) {
    const from = document.getElementById('fromId').value.trim();
    const to = document.getElementById('toId').value.trim();
    if (!from || !to || from === to) { log('Invalid IDs.'); return; }
    let count = 0;
    for (const coll of ['playerStats', 'pitchingStats']) {
      const snap = await getDocs(collection(db, coll, from, 'games'));
      log(`${coll}/${from}/games: ${snap.size} doc(s)`);
      for (const d of snap.docs) {
        log(`  ${commit ? 'Copying' : 'Would copy'} ${d.id}`);
        if (commit) {
          await setDoc(doc(db, coll, to, 'games', d.id), { ...d.data(), playerId: to, movedFrom: from }, { merge: true });
        }
        count++;
      }
    }
    log(commit ? `Done. ${count} doc(s) copied. Delete the originals and re-run aggregation.` : `Preview complete: ${count} doc(s).`);
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { log('Not signed in. Sign in on the main site first.'); return; }
    const snap = await getDoc(doc(db, 'users', user.uid));
    const u = snap.exists() ? snap.data() : {};
    const role = u.userRole || u.role || '';
    if (role === 'admin' || role === 'league-staff' || u.isAdmin) {
      log('Signed in as ' + user.email);
      document.getElementById('previewBtn').disabled = false;
      document.getElementById('runBtn').disabled = false;
    } else {
      log('Access denied. Role: ' + role);
    }
  });

  document.getElementById('previewBtn').onclick = () => run(false).catch(e => log('Error: ' + e.message));
  document.getElementById('runBtn').onclick = () => run(true).catch(e => log('Error: ' + e.message));
</script>
</body>
</html>
