<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>Submit Scores - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/admin-stats.css">
<link rel="stylesheet" href="css/submit-score.css">
</head>
<body class="aces-v2">

<!-- submit-score.html: final scores for a game (js/pages/submit-score.js). Captains and team staff see
     their team's games, league staff every game. Scored games can be corrected from All games. -->

<main class="aces-container ss-page" id="main">
  <header class="aces-page-head">
    <div>
      <span class="aces-page-kicker">My team</span>
      <h1 class="aces-page-title">Submit scores</h1>
      <p class="sse-sub" id="ssScope"></p>
    </div>
    <div class="stp-controls">
      <span class="aces-select-wrap"><select class="aces-select" id="ssSeason" aria-label="Season"></select></span>
      <a class="aces-btn is-sm is-ghost" href="scoring-guide.html">Guide</a>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
  </div>

  <div data-page-content hidden>
    <div id="ssBody">
      <div class="stp-games-head">
        <h2 class="adm-heading">Pick a game <span class="stp-count" id="ssCount"></span></h2>
        <div class="aces-segmented" role="group" aria-label="Which games">
          <button class="aces-segment" type="button" data-games="need" aria-pressed="true">Needs a score</button>
          <button class="aces-segment" type="button" data-games="all" aria-pressed="false">All games</button>
        </div>
      </div>
      <div id="ssGames" class="ss-games-wrap"></div>

      <section class="aces-card sse-entry" id="ssEntry" hidden>
        <div class="sse-entry-head">
          <div>
            <h2 class="aces-card-title" id="ssTitle"></h2>
            <p class="sse-sub" id="ssWhen"></p>
          </div>
          <button class="aces-btn is-sm is-ghost" id="ssClose" type="button">Pick another game</button>
        </div>

        <div class="aces-notice" id="ssNotice" role="status" hidden></div>

        <div class="ss-score">
          <label class="ss-team" for="ssAway"><span class="ss-team-name" id="ssAwayName"></span><span class="sse-dim">Away</span></label>
          <input class="aces-input ss-runs" id="ssAway" type="number" min="0" inputmode="numeric" placeholder="0">
          <label class="ss-team" for="ssHome"><span class="ss-team-name" id="ssHomeName"></span><span class="sse-dim">Home</span></label>
          <input class="aces-input ss-runs" id="ssHome" type="number" min="0" inputmode="numeric" placeholder="0">
        </div>

        <label class="agg-check"><input type="checkbox" id="ssLineOn"> <span>Add the line score (runs by inning). The totals then come from the innings.</span></label>
        <div class="ss-line" id="ssLine" hidden>
          <div class="aces-table-wrap"><table class="aces-table is-compact ss-line-table" id="ssLineTable"></table></div>
          <div class="ss-inn-ctrl">
            <button class="aces-btn is-sm" type="button" id="ssInnLess" aria-label="Remove an inning">&minus;</button>
            <span id="ssInnCount"></span>
            <button class="aces-btn is-sm" type="button" id="ssInnMore" aria-label="Add an inning">+</button>
          </div>
        </div>

        <label class="agg-check"><input type="checkbox" id="ssForfeit"> <span>This game was a forfeit</span></label>
        <div class="aces-field ss-notes">
          <label class="aces-label" for="ssNotes">Notes (optional)</label>
          <input class="aces-input" id="ssNotes" type="text" maxlength="300" placeholder="Anything league staff should know">
        </div>

        <p class="ss-preview" id="ssPreview" aria-live="polite"></p>
        <div class="sse-actions"><button class="aces-btn is-primary" id="ssSave" type="button">Save score</button></div>
        <p class="ss-done" id="ssDone" hidden></p>
      </section>
    </div>
  </div>
</main>

<script type="module" src="js/pages/submit-score.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
